[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-security-agent"
version = "0.1.0"
description = "Read-only, offline-first GitHub security review primitives."
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
github-security-agent = "github_security_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

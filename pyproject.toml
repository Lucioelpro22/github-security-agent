[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "github-security-agent"
version = "0.1.0"
description = "Defensive, auditable GitHub security posture analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luciano Leal" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.9,<1",
  "mypy>=2.3.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/github_security_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["github_security_agent"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "I001", "RUF100"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["github_security_agent"]


name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check src/github_security_agent/__init__.py src/github_security_agent/cli.py src/github_security_agent/domain.py src/github_security_agent/provider.py src/github_security_agent/service.py src/github_security_agent/repository_scan.py src/github_security_agent/dependency_audit.py src/github_security_agent/github_provider.py tests/test_cli.py tests/test_dependency_audit.py tests/test_github_provider.py tests/test_domain.py tests/test_package.py tests/test_service.py tests/test_repository_scan.py src/github_security_agent/http_transport.py tests/test_http_transport.py src/github_security_agent/client.py src/github_security_agent/scanner.py src/github_security_agent/file_reader.py tests/test_client.py tests/test_file_reader.py tests/test_scanner.py tests/test_rubygems_lock.py
      - name: Offline dashboard tests
        if: matrix.python-version == '3.12'
        run: node --test tests/dashboard.test.cjs
      - name: Type check
        if: matrix.python-version == '3.12'
        run: python -m mypy src
      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit --strict --desc

  ci-gate:
    name: CI
    if: always()
    needs: [quality, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.dependency-audit.result }}" = success

name: Authenticated GitHub smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install reviewed agent
        run: python -m pip install .
      - name: Validate authentication and complete alert inventory
        env:
          SECURITY_AGENT_READ_TOKEN: ${{ secrets.SECURITY_AGENT_READ_TOKEN }}
          TARGET_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ -z "$SECURITY_AGENT_READ_TOKEN" ]; then
            echo 'Missing SECURITY_AGENT_READ_TOKEN repository secret.' >&2
            exit 2
          fi
          python -m github_security_agent.cli scan --owner "$TARGET_OWNER" --repo github-security-agent --provider github --token-env SECURITY_AGENT_READ_TOKEN --format json > "$RUNNER_TEMP/github-agent-authenticated-report.json"
          python -c 'import json, os; from pathlib import Path; data=json.loads((Path(os.environ["RUNNER_TEMP"])/"github-agent-authenticated-report.json").read_text()); assert data["status"] == "complete"; print("Authenticated inventory completed; report contents withheld.")'
